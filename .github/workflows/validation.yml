name: Scientific validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[interop]' pytest coverage hypothesis
      - run: coverage run --branch --source=calibmap -m pytest && coverage json
      - run: PYTHONPATH=. python benchmarks/interoperability.py
      - run: python scripts/coverage_gate.py
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ['ruff check .', 'ruff format --check --diff .', 'mypy --ignore-missing-imports calibmap']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff mypy
      - run: ${{ matrix.command }}
      - name: Show suggested fixes after a lint or format failure
        if: failure() && startsWith(matrix.command, 'ruff')
        run: |
          ruff check --fix --unsafe-fixes . || true
          ruff format .
          git diff --no-color
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build && twine check --strict dist/*
      - run: sha256sum dist/* | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: development-distributions
          path: |
            dist/*
            SHA256SUMS
      - name: Install both artifacts outside the checkout
        run: |
          for file in "$PWD"/dist/*; do
            target=$(mktemp -d)
            python -m venv "$target/env"
            "$target/env/bin/pip" install "$file"
            (cd "$target" && env/bin/python -I -c 'from calibmap.readout import Binary; assert Binary(0,0).invert(.25) == (.25,1)')
          done
  provider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ibm]'
      - run: python benchmarks/provider.py
  studies:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . matplotlib
      - run: |
          python benchmarks/principal.py > benchmarks/principal.json
          python benchmarks/scenarios.py > benchmarks/scenarios.json
          python benchmarks/sensitivity.py > benchmarks/sensitivity.json
          python benchmarks/plot_results.py
          python benchmarks/device_study.py
      - uses: actions/upload-artifact@v4
        with:
          name: scientific-studies
          path: |
            benchmarks/*.svg
            benchmarks/principal.json
            benchmarks/scenarios.json
            benchmarks/sensitivity.json
  newer-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pytest hypothesis
      - run: python -m pytest
