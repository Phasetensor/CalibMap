name: Scientific validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[interop]' pytest coverage
      - run: coverage run --branch --source=calibmap -m pytest && coverage json
      - run: PYTHONPATH=. python benchmarks/interoperability.py
      - run: python scripts/coverage_gate.py
  static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: ['ruff check .', 'ruff format --check --diff .', 'mypy --ignore-missing-imports calibmap']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . ruff mypy
      - run: ${{ matrix.command }}
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build && twine check --strict dist/*
      - name: Install both artifacts outside the checkout
        run: |
          for file in "$PWD"/dist/*; do
            target=$(mktemp -d)
            python -m venv "$target/env"
            "$target/env/bin/pip" install "$file"
            (cd "$target" && env/bin/python -I -c 'from calibmap.readout import Binary; assert Binary(0,0).invert(.25) == (.25,1)')
          done
